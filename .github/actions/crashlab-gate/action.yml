name: Crash Lab Gate
description: Start a Crash Lab CI run and block until it passes or fails thresholds

inputs:
  base_url:
    description: Crash Lab API base URL
    required: false
    default: http://localhost:8000
  token:
    description: CI token for X-CrashLab-Token
    required: true
  trace_id:
    description: Trace UUID to replay
    required: true
  campaign_id:
    description: Campaign UUID to execute
    required: true
  min_pass_rate:
    description: Minimum pass rate threshold (0-1)
    required: false
    default: "0.8"
  max_unsafe:
    description: Maximum allowed unsafe attempts
    required: false
    default: "0"
  poll_seconds:
    description: Poll interval in seconds
    required: false
    default: "10"
  timeout_seconds:
    description: Total timeout in seconds
    required: false
    default: "900"

outputs:
  run_id:
    description: Crash Lab run UUID
    value: ${{ steps.gate.outputs.run_id }}
  decision:
    description: Gate decision (pass|fail|pending)
    value: ${{ steps.gate.outputs.decision }}
  dashboard_url:
    description: Crash Lab run URL
    value: ${{ steps.gate.outputs.dashboard_url }}

runs:
  using: composite
  steps:
    - name: Start and poll Crash Lab gate
      id: gate
      shell: bash
      env:
        INPUT_BASE_URL: ${{ inputs.base_url }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_TRACE_ID: ${{ inputs.trace_id }}
        INPUT_CAMPAIGN_ID: ${{ inputs.campaign_id }}
        INPUT_MIN_PASS_RATE: ${{ inputs.min_pass_rate }}
        INPUT_MAX_UNSAFE: ${{ inputs.max_unsafe }}
        INPUT_POLL_SECONDS: ${{ inputs.poll_seconds }}
        INPUT_TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
      run: |
        set -euo pipefail

        base_url="${INPUT_BASE_URL%/}"
        poll_seconds="${INPUT_POLL_SECONDS}"
        timeout_seconds="${INPUT_TIMEOUT_SECONDS}"

        post_payload="$(python3 - <<'PY'
        import json
        import os

        payload = {
            "trace_id": os.environ["INPUT_TRACE_ID"],
            "campaign_id": os.environ["INPUT_CAMPAIGN_ID"],
            "thresholds": {
                "min_pass_rate": float(os.environ["INPUT_MIN_PASS_RATE"]),
                "max_unsafe": int(os.environ["INPUT_MAX_UNSAFE"]),
            },
        }
        print(json.dumps(payload))
        PY
        )"

        post_body_file="$(mktemp)"
        post_status="$(
          curl -sS -o "${post_body_file}" -w "%{http_code}" \
            -X POST "${base_url}/v1/ci/runs" \
            -H "Content-Type: application/json" \
            -H "X-CrashLab-Token: ${INPUT_TOKEN}" \
            -d "${post_payload}"
        )"

        if [[ "${post_status}" -lt 200 || "${post_status}" -ge 300 ]]; then
          echo "Crash Lab gate start failed (HTTP ${post_status})"
          cat "${post_body_file}"
          exit 1
        fi

        post_response="$(cat "${post_body_file}")"
        run_id="$(python3 - <<'PY' <<<"${post_response}"
        import json
        import sys
        print(json.load(sys.stdin)["run_id"])
        PY
        )"

        echo "Started Crash Lab CI run: ${run_id}"
        echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"

        start_epoch="$(date +%s)"
        decision="pending"
        status_value=""
        pass_rate="0.0"
        unsafe_attempts="0"
        dashboard_url=""
        failures_summary="[]"

        while true; do
          now_epoch="$(date +%s)"
          elapsed="$((now_epoch - start_epoch))"
          if (( elapsed > timeout_seconds )); then
            echo "Crash Lab gate timed out after ${timeout_seconds}s (run_id=${run_id})"
            exit 1
          fi

          get_body_file="$(mktemp)"
          get_status="$(
            curl -sS -o "${get_body_file}" -w "%{http_code}" \
              "${base_url}/v1/ci/runs/${run_id}" \
              -H "X-CrashLab-Token: ${INPUT_TOKEN}"
          )"
          if [[ "${get_status}" -lt 200 || "${get_status}" -ge 300 ]]; then
            echo "Crash Lab gate poll failed (HTTP ${get_status})"
            cat "${get_body_file}"
            exit 1
          fi

          get_response="$(cat "${get_body_file}")"
          parsed_line="$(python3 - <<'PY' <<<"${get_response}"
        import json
        import sys

        data = json.load(sys.stdin)
        failures = [
            f"{item.get('tool')}:{item.get('count')}"
            for item in (data.get("failures_by_tool") or [])
        ]
        print("\t".join([
            str(data.get("decision", "pending")),
            str(data.get("status", "")),
            str(data.get("pass_rate", 0.0)),
            str(data.get("unsafe_attempts", 0)),
            str(data.get("dashboard_url", "")),
            ", ".join(failures) if failures else "none",
        ]))
        PY
          )"

          IFS=$'\t' read -r decision status_value pass_rate unsafe_attempts dashboard_url failures_summary <<<"${parsed_line}"
          echo "Crash Lab gate poll: run_id=${run_id} status=${status_value} decision=${decision} pass_rate=${pass_rate} unsafe_attempts=${unsafe_attempts} failures_by_tool=${failures_summary}"

          if [[ "${decision}" != "pending" ]]; then
            break
          fi

          sleep "${poll_seconds}"
        done

        echo "decision=${decision}" >> "${GITHUB_OUTPUT}"
        echo "dashboard_url=${dashboard_url}" >> "${GITHUB_OUTPUT}"

        summary_line="Crash Lab gate ${decision}: run_id=${run_id}, status=${status_value}, pass_rate=${pass_rate}, unsafe_attempts=${unsafe_attempts}, failures_by_tool=${failures_summary}, dashboard_url=${dashboard_url}"
        echo "${summary_line}"
        if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
          {
            echo "## Crash Lab Gate"
            echo
            echo "- Run ID: \`${run_id}\`"
            echo "- Status: \`${status_value}\`"
            echo "- Decision: \`${decision}\`"
            echo "- Pass rate: \`${pass_rate}\`"
            echo "- Unsafe attempts: \`${unsafe_attempts}\`"
            echo "- Failures by tool (top 3): \`${failures_summary}\`"
            echo "- Run URL: ${dashboard_url}"
          } >> "${GITHUB_STEP_SUMMARY}"
        fi

        if [[ "${decision}" == "fail" ]]; then
          exit 1
        fi
