name: Release Go Recorder Module

on:
  push:
    tags:
      - "clients/go-recorder/v*"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Test go-recorder module
        run: |
          cd clients/go-recorder
          go test ./...

  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release for tag
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
