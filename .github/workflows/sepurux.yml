name: Sepurux Chaos Test

on:
  workflow_dispatch:
  # Uncomment to run automatically on pull requests:
  # pull_request:

jobs:
  chaos-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Sepurux CLI
        run: pip install sepurux

      - name: Run campaign
        run: |
          sepurux run campaign \
            --project my-agent \
            --campaign core-reliability \
            --min-reliability 80 \
            --timeout 600 \
            --api-key ${{ secrets.SEPURUX_API_KEY }}
        env:
          SEPURUX_API_BASE_URL: https://api.sepurux.com
