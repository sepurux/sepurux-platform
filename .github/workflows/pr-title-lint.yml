name: PR Title Lint

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title follows Conventional Commits
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Allowed types: keep it tight and useful
          types: |
            feat
            fix
            chore
            docs
            test
            refactor
            perf
            ci
            build
          # Optional scopes you’ll commonly use
          scopes: |
            api
            worker
            infra
            traces
            campaigns
            runs
            replay
            mutations
            eval
            ui
          requireScope: false
          subjectPattern: ^[a-z].+$
          subjectPatternError: "PR title subject must start with a lowercase letter (e.g., 'feat(api): add health endpoint')."
