name: Deploy Hetzner

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Commit SHA or ref to deploy (defaults to current SHA)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-hetzner-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Hetzner
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Resolve deploy ref
        id: deploy_ref
        env:
          INPUT_REF: ${{ github.event.inputs.git_ref }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_REF}" ]; then
            echo "value=${INPUT_REF}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}

      - name: Add known_hosts
        env:
          HETZNER_SSH_KNOWN_HOSTS: ${{ secrets.HETZNER_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "${HETZNER_SSH_KNOWN_HOSTS}" ]; then
            echo "Missing required secret: HETZNER_SSH_KNOWN_HOSTS" >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${HETZNER_SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy on server
        env:
          DEPLOY_REF: ${{ steps.deploy_ref.outputs.value }}
          HETZNER_SSH_HOST: ${{ secrets.HETZNER_SSH_HOST }}
          HETZNER_SSH_USER: ${{ secrets.HETZNER_SSH_USER }}
          HETZNER_DEPLOY_PATH: ${{ secrets.HETZNER_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          : "${HETZNER_SSH_HOST:?Missing required secret: HETZNER_SSH_HOST}"
          : "${HETZNER_SSH_USER:?Missing required secret: HETZNER_SSH_USER}"
          : "${HETZNER_DEPLOY_PATH:?Missing required secret: HETZNER_DEPLOY_PATH}"
          : "${DEPLOY_REF:?Missing DEPLOY_REF}"

          ssh -o BatchMode=yes "${HETZNER_SSH_USER}@${HETZNER_SSH_HOST}" \
            "DEPLOY_REF='${DEPLOY_REF}' DEPLOY_PATH='${HETZNER_DEPLOY_PATH}' bash -se" <<'EOF'
          set -euo pipefail

          if [ ! -d "${DEPLOY_PATH}" ]; then
            echo "Deploy path does not exist: ${DEPLOY_PATH}" >&2
            exit 1
          fi

          cd "${DEPLOY_PATH}"

          if [ ! -d .git ]; then
            echo "Deploy path is not a git repository: ${DEPLOY_PATH}" >&2
            exit 1
          fi

          if [ ! -f infra/.env.hetzner ]; then
            echo "Missing infra/.env.hetzner on server." >&2
            exit 1
          fi

          git fetch --prune origin main
          git checkout --force "${DEPLOY_REF}"

          ./infra/scripts/deploy_hetzner.sh
          EOF
