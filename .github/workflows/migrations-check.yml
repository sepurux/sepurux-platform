name: Migrations Check

on:
  pull_request:

jobs:
  check-alembic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Warn if models changed without migrations
        run: |
          if git diff --name-only origin/main...HEAD | grep -E "api/app/models.py|api/app/models/"; then
            if ! git diff --name-only origin/main...HEAD | grep -E "^api/alembic/versions/"; then
              echo "Models changed but no Alembic migration found in api/alembic/versions/"
              echo "If this is intentional, ignore. Otherwise add a migration."
              exit 1
            fi
          fi