name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  lint-type-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          if [ -f worker/requirements.txt ]; then pip install -r worker/requirements.txt; fi

      - name: Ruff (lint)
        run: |
          ruff check api/app worker

      - name: Black (format check)
        run: |
          black --check api/app worker

      - name: Mypy (types)
        run: |
          mypy api/app worker

      - name: Pytest
        run: |
          pytest --cov=api/app --cov=worker --cov-report=term-missing
