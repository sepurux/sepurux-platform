name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

categories:
  - title: "Features"
    labels:
      - "feat"
  - title: "Fixes"
    labels:
      - "fix"
  - title: "Infrastructure & CI"
    labels:
      - "area:ci"
      - "area:infra"
  - title: "Documentation"
    labels:
      - "area:docs"

change-template: "- $TITLE (#$NUMBER) @$AUTHOR"
template: |
  ## Changes
  $CHANGES

version-resolver:
  major:
    labels: ["breaking"]
  minor:
    labels: ["feat"]
  patch:
    labels: ["fix"]
  default: patch