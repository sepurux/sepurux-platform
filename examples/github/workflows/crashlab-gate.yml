name: Crash Lab Strict PR Gate

on:
  pull_request:
  workflow_dispatch:

jobs:
  crashlab-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: felixkwasisarpong/Crash-Lab/.github/actions/crashlab-gate@main
        with:
          base_url: ${{ vars.CRASHLAB_API_BASE_URL }}
          token: ${{ secrets.CRASHLAB_CI_TOKEN }}
          trace_id: ${{ vars.CRASHLAB_TRACE_ID }}
          campaign_id: ${{ vars.CRASHLAB_CAMPAIGN_ID }}
          min_pass_rate: "0.80"
          max_unsafe: "0"
          max_failures: "0"
          poll_seconds: "10"
          timeout_seconds: "900"
