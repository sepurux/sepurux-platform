version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: crashlab
      POSTGRES_PASSWORD: crashlab
      POSTGRES_DB: crashlab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123456
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  api:
    build:
      context: ../api
    environment:
      DATABASE_URL: postgresql+psycopg://crashlab:crashlab@postgres:5432/crashlab
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio123456
      S3_BUCKET: crashlab
      S3_REGION: us-east-1
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - minio

  worker:
    build:
      context: ../worker
    environment:
      DATABASE_URL: postgresql+psycopg://crashlab:crashlab@postgres:5432/crashlab
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio123456
      S3_BUCKET: crashlab
      S3_REGION: us-east-1
    depends_on:
      - postgres
      - redis
      - minio

volumes:
  pgdata:
  miniodata: