version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: crashlab
      POSTGRES_PASSWORD: crashlab
      POSTGRES_DB: crashlab
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123456
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  opa:
    image: openpolicyagent/opa:latest
    command: ["run", "--server", "--log-level=error", "/policies"]
    expose:
      - "8181"
    volumes:
      - ./opa-policies:/policies:ro

  api:
    build:
      context: ../api
    environment:
      DATABASE_URL: postgresql+psycopg://crashlab:crashlab@postgres:5432/crashlab
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio123456
      S3_BUCKET: crashlab
      S3_REGION: us-east-1
      OPA_URL: http://opa:8181
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - minio
      - opa

  worker:
    build:
      context: ../worker
    environment:
      DATABASE_URL: postgresql+psycopg://crashlab:crashlab@postgres:5432/crashlab
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio123456
      S3_BUCKET: crashlab
      S3_REGION: us-east-1
      OPA_URL: http://opa:8181
    depends_on:
      - postgres
      - redis
      - minio
      - opa

  ui:
    build:
      context: ../ui
      args:
        NEXT_PUBLIC_API_BASE_URL: http://api:8000
        NEXT_PUBLIC_CRASHLAB_API_KEY: crashlab-dev-key
        NEXT_PUBLIC_PROJECT_ID: 22222222-2222-2222-2222-222222222222
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://api:8000
      NEXT_PUBLIC_CRASHLAB_API_KEY: crashlab-dev-key
      NEXT_PUBLIC_PROJECT_ID: 22222222-2222-2222-2222-222222222222
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  miniodata:
