services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crashlab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crashlab}
      POSTGRES_DB: ${POSTGRES_DB:-crashlab}
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123456
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  opa:
    image: openpolicyagent/opa:latest
    command: ["run", "--server", "--addr=0.0.0.0:8181", "--watch", "/policies"]
    expose:
      - "8181"
    volumes:
      - ./opa-policies:/policies:ro

  api:
    build:
      context: ../api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://crashlab:crashlab@postgres:5432/crashlab}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio123456
      S3_BUCKET: ${S3_BUCKET:-sepurux}
      S3_REGION: us-east-1
      OPA_URL: http://opa:8181
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      SUPER_ADMIN_EMAILS: ${SUPER_ADMIN_EMAILS:-}
      SEPURUX_UI_BASE_URL: ${SEPURUX_UI_BASE_URL:-http://localhost:3000}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      EMAIL_RESEND_API_KEY: ${EMAIL_RESEND_API_KEY:-}
      EMAIL_RESEND_API_BASE_URL: ${EMAIL_RESEND_API_BASE_URL:-https://api.resend.com}
      SEPURUX_API_PUBLIC_URL: ${SEPURUX_API_PUBLIC_URL:-http://localhost:8000}
      SEPURUX_DOCS_URL: ${SEPURUX_DOCS_URL:-https://docs.sepurux.com}
      SEPURUX_EMAIL_LOGO_URL: ${SEPURUX_EMAIL_LOGO_URL:-}
      SEPURUX_EMAIL_BRAND_COLOR: ${SEPURUX_EMAIL_BRAND_COLOR:-#22c55e}
      PASSWORD_RESET_TOKEN_TTL_MINUTES: ${PASSWORD_RESET_TOKEN_TTL_MINUTES:-30}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-common}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PRO_MONTHLY: ${STRIPE_PRICE_PRO_MONTHLY:-}
      STRIPE_PRICE_TEAM_MONTHLY: ${STRIPE_PRICE_TEAM_MONTHLY:-}
      STRIPE_PRICE_ENTERPRISE_MONTHLY: ${STRIPE_PRICE_ENTERPRISE_MONTHLY:-}
      STRIPE_CURRENCY: ${STRIPE_CURRENCY:-usd}
      STRIPE_TOPUP_CENTS_PER_CREDIT: ${STRIPE_TOPUP_CENTS_PER_CREDIT:-1}
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - minio
      - opa

  worker:
    build:
      context: ../worker
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://crashlab:crashlab@postgres:5432/crashlab}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio123456
      S3_BUCKET: ${S3_BUCKET:-sepurux}
      S3_REGION: us-east-1
      OPA_URL: http://opa:8181
    depends_on:
      - postgres
      - redis
      - minio
      - opa

  scheduler:
    build:
      context: ../worker
    command: python scheduler.py
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://crashlab:crashlab@postgres:5432/crashlab}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio123456
      S3_BUCKET: ${S3_BUCKET:-sepurux}
      S3_REGION: us-east-1
      OPA_URL: http://opa:8181
    depends_on:
      - postgres
      - redis
      - minio
      - opa

  ui:
    build:
      context: ../ui
      args:
        NEXT_PUBLIC_API_BASE_URL: http://api:8000
        NEXT_PUBLIC_SEPURUX_API_KEY: sepurux-dev-key
        NEXT_PUBLIC_PROJECT_ID: 22222222-2222-2222-2222-222222222222
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://api:8000
      NEXT_PUBLIC_SEPURUX_API_KEY: sepurux-dev-key
      NEXT_PUBLIC_PROJECT_ID: 22222222-2222-2222-2222-222222222222
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  miniodata:
