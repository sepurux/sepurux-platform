services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      APP_ALT_DOMAIN: ${APP_ALT_DOMAIN}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
      SITE_DOMAIN: ${SITE_DOMAIN}
      SITE_WWW_DOMAIN: ${SITE_WWW_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - site
      - ui

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data

  opa:
    image: openpolicyagent/opa:latest
    restart: unless-stopped
    command: ["run", "--server", "--addr=0.0.0.0:8181", "--watch", "/policies"]
    volumes:
      - ./opa-policies:/policies:ro

  api:
    build:
      context: ../api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      OPA_URL: ${OPA_URL}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS}
      SEPURUX_UI_BASE_URL: ${APP_PUBLIC_URL}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      EMAIL_RESEND_API_KEY: ${EMAIL_RESEND_API_KEY:-}
      EMAIL_RESEND_API_BASE_URL: ${EMAIL_RESEND_API_BASE_URL:-https://api.resend.com}
      SEPURUX_API_PUBLIC_URL: ${SEPURUX_API_PUBLIC_URL:-https://app.sepurux.dev/api/backend}
      SEPURUX_DOCS_URL: ${SEPURUX_DOCS_URL:-https://docs.sepurux.com}
      SEPURUX_EMAIL_LOGO_URL: ${SEPURUX_EMAIL_LOGO_URL:-}
      SEPURUX_EMAIL_BRAND_COLOR: ${SEPURUX_EMAIL_BRAND_COLOR:-#22c55e}
      PASSWORD_RESET_TOKEN_TTL_MINUTES: ${PASSWORD_RESET_TOKEN_TTL_MINUTES:-30}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PRICE_PRO_MONTHLY: ${STRIPE_PRICE_PRO_MONTHLY}
      STRIPE_PRICE_TEAM_MONTHLY: ${STRIPE_PRICE_TEAM_MONTHLY}
      STRIPE_PRICE_ENTERPRISE_MONTHLY: ${STRIPE_PRICE_ENTERPRISE_MONTHLY}
      STRIPE_CURRENCY: ${STRIPE_CURRENCY}
      STRIPE_TOPUP_CENTS_PER_CREDIT: ${STRIPE_TOPUP_CENTS_PER_CREDIT}
    command: sh -lc 'alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000'
    depends_on:
      - postgres
      - redis
      - minio
      - opa

  worker:
    build:
      context: ../worker
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      OPA_URL: ${OPA_URL}
    depends_on:
      - postgres
      - redis
      - minio
      - opa

  scheduler:
    build:
      context: ../worker
    command: python scheduler.py
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      OPA_URL: ${OPA_URL}
    depends_on:
      - postgres
      - redis
      - minio
      - opa

  ui:
    build:
      context: ../ui
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_SEPURUX_API_KEY: ${NEXT_PUBLIC_SEPURUX_API_KEY}
        NEXT_PUBLIC_PROJECT_ID: ${NEXT_PUBLIC_PROJECT_ID}
    restart: unless-stopped
    environment:
      INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
      NEXT_PUBLIC_SEPURUX_API_KEY: ${NEXT_PUBLIC_SEPURUX_API_KEY}
      NEXT_PUBLIC_PROJECT_ID: ${NEXT_PUBLIC_PROJECT_ID}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    depends_on:
      - api

  site:
    build:
      context: ../site
      args:
        NEXT_PUBLIC_SITE_URL: ${SITE_PUBLIC_URL}
        NEXT_PUBLIC_APP_URL: ${APP_PUBLIC_URL}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_SITE_URL: ${SITE_PUBLIC_URL}
      NEXT_PUBLIC_APP_URL: ${APP_PUBLIC_URL}

volumes:
  caddy_config:
  caddy_data:
  miniodata:
  pgdata:
